<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .green {
        min-width: 40px;
        background-color: rgb(102, 63, 118);
        height: 20px;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .box {
        max-width: 800px;
        border: 2px black solid;

        border-radius: 10px;
        height: 150px;

        gap: 8px;
        padding-left: 10px;
        flex-wrap: wrap;
        display: flex;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="green">HTML</div>
      <div class="green">CSS</div>
      <div class="green">Flexbox</div>
      <div class="green">Googel Fonts</div>
      <div class="green">Lucide</div>
      <div class="green">Hover</div>
      <div class="green">Box-shadow</div>
      <div class="green">MAX width</div>
      <div class="green">flex-wrap</div>
      <div class="green">Netlify</div>
    </div>
  </body>
</html>
