<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        width: 827px;
        border: 2px black solid;
        height: 100px;
        border-radius: 10px;
      }
      .day {
        display: flex;

        background-color: #f3e8ff;
        color: #6b21a8;
        border-radius: 100px;

        width: 70px;
        height: 20px;
      }
      .box2 {
        width: 30%;
        display: flex;
        height: 100px;

        gap: 10px;
        padding-left: 15px;
        align-items: center;
      }
      @media (max-width: 768px) {
        .day {
          width: 30%;
          align-items: center;
          font-size: 14px;
        }
        .box2 {
          justify-content: space-between;
        }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="box2">
        <div class="day">day 1</div>
        <div class="day">day 2</div>
        <div class="day">day 3</div>
      </div>
    </div>
  </body>
</html>
