<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .green {
        min-width: 110px;
        background-color: rgb(6, 66, 6);

        height: 110px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: yellow;
      }
      .box {
        max-width: 800px;
        border: 2px black solid;
        height: 300px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 20px;
        flex-wrap: wrap;
        justify-content: space-around;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="green">1</div>
      <div class="green">2</div>
      <div class="green">3</div>
      <div class="green">4</div>
      <div class="green">5</div>
      <div class="green">6</div>
    </div>
  </body>
</html>
