<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        max-width: 400px;
        height: 100px;

        border-radius: 10px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .m {
        max-width: 400px;
        height: 40px;
        background-color: silver;
        border-radius: 9999px;
        display: flex;
        align-items: center;
      }
      .m2 {
        width: 75%;
        background-color: rgb(207, 155, 10);
        border-radius: 9999px;
        height: 30px;
        display: flex;
        align-items: center;
        padding-left: 20px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div>Тасалбар</div>
      <div class="m">
        <div class="m2">75% зарагдсан</div>
      </div>
    </div>
  </body>
</html>
